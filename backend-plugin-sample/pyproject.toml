[build-system]
requires = ["setuptools", "setuptools-scm>8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "openedx-plugin-sample"
description = "A sample backend plugin for the Open edX Platform"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE*"]
authors = [
    {name = "Open edX Project", email = "oscm@openedx.org"},
]
classifiers = [
    'Development Status :: 3 - Alpha',
    'Framework :: Django',
    'Framework :: Django :: 5.2',
    'Framework :: Django :: 6.0',
    'Intended Audience :: Developers',
    'Natural Language :: English',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.12',
]
keywords = [
    "Python",
    "edx",
]

dynamic = ["readme", "version"]

# Unconstrained on purpose. The Open edX platform pins these itself, and a
# plugin that narrows them causes resolution conflicts when it is installed
# into edx-platform. `>=0` rather than a bare name because Renovate skips any
# dependency with no version specifier at all, so bare names would never get
# update PRs. It is the PEP 440 equivalent of the "*" ranges in
# frontend-plugin-sample/package.json -- PEP 440 has no bare wildcard.
# Please don't "tidy" these into real floors without a reason to; a floor we
# cannot justify is a compatibility claim we cannot back up.
dependencies = [
    "Django>=0",
    "djangorestframework>=0",
    "django-filter>=0",
    "edx-opaque-keys>=0",
    "openedx-core>=0",
    "openedx-events>=0",
    "openedx-filters>=0",
    "openedx-atlas>=0",
    "edx-django-utils>=0",
    "django-crum>=0",
]

[project.entry-points."lms.djangoapp"]
openedx_plugin_sample = "openedx_plugin_sample.apps:SamplePluginConfig"

[project.entry-points."cms.djangoapp"]
openedx_plugin_sample = "openedx_plugin_sample.apps:SamplePluginConfig"

[project.urls]
Homepage = "https://github.com/openedx/sample-plugin"
Repository = "https://github.com/openedx/sample-plugin"

[dependency-groups]
# `>=0` here for the same reason as [project].dependencies above: Renovate
# skips dependencies with no version specifier. The two Django entries below
# are the real exception -- they define the test matrix.
test-base = [
    "pytest-cov>=0",
    "pytest-django>=0",
    "code-annotations>=0",
    "edx-django-utils>=0",
    "django-extensions>=0",
]
# Current default Django version used by quality, docs, and the default test
# matrix entry. When adding or retiring a Django version from the matrix, see
# https://docs.openedx.org/en/latest/developers/how-tos/manage-uv-dependency-matrix.html
test = [
    {include-group = "test-base"},
    "Django>=5.0,<6.0",
]
django60 = [
    {include-group = "test-base"},
    "Django>=6.0,<7.0",
]
quality = [
    {include-group = "test"},
    # A real floor, not a placeholder: `edx_lint write_uv_constraints`, used by
    # `make upgrade` and `make check-constraints`, was added in 6.2.0.
    "edx-lint>=6.2",
    "isort>=0",
    "pycodestyle>=0",
    "pydocstyle>=0",
]
doc = [
    {include-group = "test"},
    "doc8>=0",
    "sphinx-book-theme>=0",
    "twine>=0",
    "build>=0",
    "Sphinx>=0",
]
ci = [
    "tox>=0",
    "tox-uv>=0",
]
dev = [
    {include-group = "quality"},
    {include-group = "ci"},
    "diff-cover>=0",
    "edx-i18n-tools>=0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type = "text/markdown" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.semantic_release]
# We use SETUPTOOLS_SCM_PRETEND_VERSION to pull the version from python-semantic-release instead
# of actually pulling it from version control because the build step happens before the repo gets
# tagged. Setuptools by default doesn't have any way of overriding the version number at build
# time without a setup.py file.  This is a fine alternative that reduces the amount of boilerplate
# code and files we need in this repo.
build_command = "pip install build && SETUPTOOLS_SCM_PRETEND_VERSION=$NEW_VERSION python -m build"

[tool.semantic_release.commit_parser_options]
# Because this repo is meant to be an example, docs changes are relevant
# feature changes and so should produces new releases.
minor_tags = ["feat", "docs"]
# If we change the build system, we want to publish it so that updates to the
# build and release system are validated close to when they are merged.
patch_tags = ["fix", "perf", "build"]

[tool.setuptools_scm]
# The root for the gith repo is one directory up.
root = ".."
version_scheme = 'only-version'
local_scheme = 'no-local-version'

# Dummy version number for when ../.git isn't accessible.
# This happens, for example, when bind-mounting the backend-plugin- into a Docker image.
fallback_version = "0.0.0.dev0"

[tool.uv]
# Supply-chain cooling-off period: never resolve to a release younger than
# this. A hijacked release is usually yanked within a few days, so waiting is
# cheap insurance for a repo where nothing is urgent.
#
# uv records the window in uv.lock as `[options] exclude-newer-span = "P7D"`
# and re-evaluates it at resolve time. A widening window cannot invalidate the
# lock -- exclude-newer only restricts which candidates are eligible, it never
# forces an upgrade -- so `uv lock --check` and `uv sync --locked` keep passing
# as time goes by. Raising the number of days here can invalidate it, though,
# if the new cutoff excludes something already locked.
#
# This is the real enforcement point, not Renovate: Renovate cannot apply its
# own `minimumReleaseAge` to a lockfile refresh, because it delegates that to
# uv and never sees the individual releases. Setting it here also means a
# developer running `make upgrade` locally gets the same behaviour as the bot.
#
# *** Keep this in sync with `minimumReleaseAge` in ../renovate.json5 and with
# *** `min-release-age` in the .npmrc files. If uv is stricter than Renovate,
# *** Renovate proposes versions uv then refuses and churns empty branches.
#
# To let one urgent security fix through without dropping the window for
# everything, add a temporary exemption rather than changing this value:
#     exclude-newer-package = { the-package = false }
exclude-newer = "7 days"

# Each entry lists groups with mutually exclusive version requirements so uv can
# produce a single uv.lock that contains a separate resolution for each. Add a
# new pair here whenever you add a legacy-version group to [dependency-groups].
# See https://docs.openedx.org/en/latest/developers/how-tos/manage-uv-dependency-matrix.html
conflicts = [
    [{group = "test"}, {group = "django60"}],
]
#  DO NOT EDIT constraint-dependencies DIRECTLY.
#  This list is managed by `edx_lint write_uv_constraints`
#  and will be overwritten the next time `make upgrade` is run.
#  - GLOBAL constraints: edit edx_lint/files/common_constraints.txt
#  - REPO-SPECIFIC constraints: edit [tool.edx_lint].uv_constraints in this file
constraint-dependencies = [
    "Django<7.0",
    "elasticsearch<7.14.0",
    "social-auth-app-django<6.0.0",
    "social-auth-core<5.0.0",
    "pip<26.2.1",
]

[tool.edx_lint]
# Repo-specific uv constraints merged with edx-lint's global constraints.
# Local entries override global ones for the same package.
# Run `make upgrade` to regenerate [tool.uv].constraint-dependencies.
#
# Any cap added here also needs a matching rule in ../renovate.json5, either
# `enabled: false` or an `allowedVersions` for that package. Otherwise
# Renovate offers a version the constraint forbids, `uv lock` refuses it, and
# the branch lands with no changes -- retried on every run. See the Django
# rule there for the worked example.
uv_constraints = [
    "Django<7.0",  # this repo tests against Django 6.x; overrides the global Django<6.0 constraint
]
