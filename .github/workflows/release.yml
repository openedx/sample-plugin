name: Semantic Release

on:
  push:
    branches: [main]

jobs:
  run_backend_tests:
    uses: ./.github/workflows/backend-ci.yml

  release:
    needs: run_backend_tests
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      # Note: We checkout the repository at the branch that triggered the workflow.
      # Python Semantic Release will automatically convert shallow clones to full clones
      # if needed to ensure proper history evaluation. However, we forcefully reset the
      # branch to the workflow sha because it is possible that the branch was updated
      # while the workflow was running, which prevents accidentally releasing un-evaluated
      # changes.
      - name: Setup | Checkout Repository on Release Branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref_name }}

      - name: Setup | Force release branch to be at workflow sha
        run: |
          git reset --hard ${{ github.sha }}

      - name: Action | Semantic Version Release
        id: release
        # Adjust tag with desired version if applicable.
        uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e # v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"
          changelog: "false"
          directory: './backend-plugin-sample'
          # Commit, tag, push and build, but don't create the GitHub release.
          # We create it ourselves in the next step so that the distributions
          # are attached before the release is published. See that step for why.
          vcs_release: "false"

      # Built before the release is created so that its distributions can be
      # attached as release assets too. See the release step for why that
      # ordering matters.
      - name: Build | Tutor Plugin
        # The tutor plugin does not use python-semantic-release directly.
        # Instead it shares the version determined by the backend's semantic
        # release above, passed in via SETUPTOOLS_SCM_PRETEND_VERSION so that
        # setuptools-scm picks it up at build time.
        if: steps.release.outputs.released == 'true'
        run: pip install build && SETUPTOOLS_SCM_PRETEND_VERSION=${{ steps.release.outputs.version }} python -m build
        working-directory: './tutor-contrib-sample'

      # This repo has immutable releases enabled, which freezes a release's
      # assets the moment it is published, so assets cannot be attached
      # afterwards. Everything we want on the release has to be built by now
      # and passed to this one command, which creates the release as a draft,
      # uploads the assets, and only then publishes it:
      # https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/immutable-releases
      - name: Publish | Create GitHub Release with Assets
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Reuse the release notes python-semantic-release generated for us.
          RELEASE_NOTES: ${{ steps.release.outputs.release_notes }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          # Output the release notes to a file
          printf '%s' "$RELEASE_NOTES" > "$RUNNER_TEMP/release_notes.md"
          # Creates the release as a draft, uploads the assets, and then
          # publishes it -- all within this one command.
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release_notes.md" \
            backend-plugin-sample/dist/* \
            tutor-contrib-sample/dist/*

      - name: Upload | Backend Distribution Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.release.outputs.released == 'true'
        with:
          name: backend-distribution-artifacts
          path: backend-plugin-sample/dist
          if-no-files-found: error

      - name: Upload | Tutor Plugin Distribution Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.release.outputs.released == 'true'
        with:
          name: tutor-distribution-artifacts
          path: tutor-contrib-sample/dist
          if-no-files-found: error

    outputs:
      released: ${{ steps.release.outputs.released || 'false' }}
      version: ${{ steps.release.outputs.version }}

  publish_to_pypi:
    # 1. Separate out the publish step from the github release step to run each step at
    #    the least amount of token privilege
    # 2. Also, publishing can fail, and its better to have a separate job if you need to retry
    #    and it won't require reversing the release.
    runs-on: ubuntu-latest
    needs: release
    if: github.ref_name == 'main' && needs.release.outputs.released == 'true'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup | Download Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: artifact-download
        with:
          name: backend-distribution-artifacts
          path: backend-plugin-sample/dist

      - name: Publish to PyPi
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: backend-plugin-sample/dist
          user: __token__
          password: ${{ secrets.PYPI_UPLOAD_TOKEN }}

  publish_tutor_plugin_to_pypi:
    runs-on: ubuntu-latest
    needs: release
    if: github.ref_name == 'main' && needs.release.outputs.released == 'true'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup | Download Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tutor-distribution-artifacts
          path: tutor-contrib-sample/dist

      - name: Publish to PyPi
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: tutor-contrib-sample/dist
          user: __token__
          password: ${{ secrets.PYPI_UPLOAD_TOKEN }}

  publish_to_npm:
    runs-on: ubuntu-latest
    needs: release
    if: github.ref_name == 'main' && needs.release.outputs.released == 'true'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup | Checkout Repository on Release Ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: './frontend-plugin-sample/.nvmrc'

      - name: Update the package version and publish
        run: |
          npm install --include=dev
          npm version ${{ needs.release.outputs.version }}
          npm run build
          npm publish
        working-directory: './frontend-plugin-sample'
