name: Python CI

on:
  pull_request:
    branches:
      - "**"
  # This is so we can call CI locally from other workflows that might want to
  # run CI before doing whatever task they're doing.  Like the release workflow.
  workflow_call:

defaults:
  run:
    working-directory: "./backend-plugin-sample"

jobs:
  run_tests:
    name: tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]
        toxenv: [quality, docs, pii_check, django52, django60]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install CI dependencies
        run: uv sync --group ci

      - name: Run Tests
        env:
          TOXENV: ${{ matrix.toxenv }}
        run: uv run tox

      - name: Run coverage
        if: matrix.python-version == '3.12' && matrix.toxenv == 'django52'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          fail_ci_if_error: true
          working-directory: "./backend-plugin-sample"
