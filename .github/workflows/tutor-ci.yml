name: Tutor Plugin CI

on:
  pull_request:
    branches:
      - "**"
  # So the release workflow can run these checks before it publishes anything.
  workflow_call:

concurrency:
  # See backend-ci.yml for why non-pull_request events key on the run id.
  group: ${{ github.workflow }}-tutor-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: "./tutor-contrib-sample"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # setuptools-scm derives the version from git tags, and this project
          # sets no fallback_version, so it needs the history and tags rather
          # than the default shallow clone.
          fetch-depth: 0

      - name: setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          cache-suffix: tutor

      # Until now this package was first built inside the release job, so a
      # broken pyproject.toml surfaced only after the GitHub release and the
      # backend PyPI upload had already been published.
      - name: Build
        run: uv run --with build python -m build

      # Catches metadata that PyPI would reject or render badly -- the long
      # description is read dynamically from README.md, so it is worth checking.
      - name: Check distribution metadata
        run: uv run --with twine twine check dist/*
